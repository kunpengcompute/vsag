name: pr build

on:
  workflow_call:
    inputs:
      CP_DOCKER_IMG:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      target_branch:
        required: true
        type: string
jobs:
  JOB_Compile:
    name: Compile
    select: selected_by_default
    needs: [ ]
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=xlarge ]
    container:
      image: ${{ inputs.CP_DOCKER_IMG }}
      # options: --user root

    steps:
      - name: Checkout repository with pre merge
        uses: checkout
        with:
          repository: ${{atomgit.repositoryurl}}
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: Configure GitHub proxy
        run: git config --global url."http://git-cdn-service.git-cdn.svc.cluster.local:8000/".insteadOf "https://github.com/"
      - name: Restore ccache
        uses: cache
        with:
          path: .ccache
          key: vsag-ccache-build-${{ atomgit.run_id }}
          restore-keys: |
            vsag-ccache-build-
      - name: Execute_shell
        id: exec_shell_step
        run: |-
            set -ex
            chmod +x .gitcode/scripts/pr_build.sh
            sh .gitcode/scripts/pr_build.sh
